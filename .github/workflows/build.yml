name: Build

on:
  push:
    # renovate/** as well as main: the shared Renovate config automerges a green branch
    # straight to main without a PR, so the branch itself has to carry a status check.
    branches: [main, 'renovate/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      # One version code per run, so every APK installs over the one before it.
      ORBIT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle and checks the wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew --no-daemon assembleRelease lintDebug testDebugUnitTest

      # minSdk 29 means the APK carries no v1 JAR signature, so keytool cannot read it.
      # Traced, because this step once failed with no output at all: every command has to
      # say what it found, or a red tick here means nothing.
      - name: Check which key signed it
        run: |
          set -x
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ls -d "$sdk"/build-tools/*/ || true
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "No apksigner under $sdk/build-tools." >&2
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk" | tee "${RUNNER_TEMP:-/tmp}/certs.txt"
          # The debug key is committed on purpose and its DN is public, so printing it
          # above costs nothing and says which key actually signed the build.
          grep -q "CN=Orbit Launcher" "${RUNNER_TEMP:-/tmp}/certs.txt" || {
            echo "The APK is not signed with the committed key." >&2
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: orbit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Turns a shrunk stack trace back into line numbers.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: orbit-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
