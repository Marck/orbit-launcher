name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      # One version code per run, so every APK installs over the one before it.
      ORBIT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle and checks the wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew --no-daemon assembleRelease lintDebug testDebugUnitTest

      # minSdk 29 means the APK carries no v1 JAR signature, so keytool cannot read it.
      - name: Check which key signed it
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          dn=$("$apksigner" verify --print-certs "$apk" | grep -m1 'Signer #1 certificate DN')
          echo "$dn"
          if ! echo "$dn" | grep -q 'CN=Orbit Launcher'; then
            echo "The APK is not signed with the committed key." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Turns a shrunk stack trace back into line numbers.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
